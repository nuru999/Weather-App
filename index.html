<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Weather App</title>
    <meta name="description" content="Modern weather app with real-time forecasts">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <div class="weather-card" id="weather-card">
            <div class="search-container">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Search city (e.g Nairobi, London...)" spellcheck="false">
                    <button class="search-btn" title="Search">🔍</button>
                </div>
                <button class="location-btn" title="Use current location">📍</button>
                <button class="unit-toggle" title="Toggle °C/°F">°C</button>
            </div>

            <div class="recent-searches" id="recent-searches"></div>

            <div class="error-message" id="error-message">
                <p>⚠️ <span id="error-text">City not found. Try again.</span></p>
            </div>

            <div class="loading-spinner">
                <div class="skeleton skeleton-icon"></div>
                <div class="skeleton skeleton-temp"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton-grid">
                    <div class="skeleton skeleton-detail"></div>
                    <div class="skeleton skeleton-detail"></div>
                    <div class="skeleton skeleton-detail"></div>
                    <div class="skeleton skeleton-detail"></div>
                </div>
            </div>

            <div class="weather-content">
                <div class="weather-main">
                    <div class="weather-icon-container">
                        <img src="" alt="weather icon" class="weather-icon" id="weather-icon">
                        <div class="weather-glow"></div>
                    </div>
                    <div class="temperature">
                        <span class="temp-value">--</span>
                        <span class="temp-unit">°C</span>
                    </div>
                    <h2 class="city-name">Search for a city</h2>
                    <p class="weather-description">--</p>
                    <p class="local-time" id="local-time"></p>
                </div>

                <div class="weather-details">
                    <div class="detail-card">
                        <div class="detail-info">
                            <span class="detail-value" id="humidity">--%</span>
                            <span class="detail-label">Humidity</span>
                        </div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-info">
                            <span class="detail-value" id="wind-speed">-- km/h</span>
                            <span class="detail-label">Wind</span>
                        </div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-info">
                            <span class="detail-value" id="feels-like">--°</span>
                            <span class="detail-label">Feels Like</span>
                        </div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-info">
                            <span class="detail-value" id="pressure">-- hPa</span>
                            <span class="detail-label">Pressure</span>
                        </div>
                    </div>
                </div>

                <div class="forecast-section">
                    <h3 class="forecast-title">5-Day Forecast</h3>
                    <div class="forecast-container" id="forecast"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
